      content="Let's create awesome maps together. Interactive maps from free open data, with all code on GitHub."

    <style>
      @font-face {
        font-family: "Space Grotesk";
        font-weight: 700;
        font-style: normal;
        font-display: swap;
        src: url("fonts/SpaceGrotesk-Bold.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-weight: 500;
        font-style: normal;
        font-display: swap;
        src: url("fonts/Inter-Medium.woff2") format("woff2");
      }

      :root {
        --ink: #0f141a;
        --paper: #f4f1ea;
        --soft: #c9ced6;
        --amber: #ffb000;
        --surface: #18202a;
        --surface-hover: #1f2935;
        --display: "Space Grotesk", system-ui, sans-serif;
        --text: "Inter", system-ui, sans-serif;

        /* Motion. GSAP's power3.out as a CSS curve: quick to start, long soft landing. */
        --ease-out: cubic-bezier(0.215, 0.61, 0.355, 1);
        --enter: 280ms;
        --enter-slow: 320ms;
        --leave: 180ms;
        --stagger: 40ms;

        /* Sizes that change on phones. */
        --mark: 96px;
        --mark-gap: 48px;
        --wordmark: 72px;
        --byline: 24px;
        --byline-top: 85px;
        --rule-w: 78px;
        --rule-h: 4px;
        --rule-gap: 40px;
        --slogan: 30px;
        --slogan-gap: 32px;
        --intro: 18px;
        --head-top: 96px;
        --head-bottom: 96px;
        --side: 24px;
        --grid-gap: 32px;
        --card-pad: 24px;
        --card-mark-gap: 22px;
        --card-title: 24px;
        --card-line: 16px;
      }
      @media (max-width: 639px) {
        :root {
          --mark: 56px;
          --mark-gap: 28px;
          --wordmark: 42px;
          --byline: 14px;
          --byline-top: 50px;
          --rule-w: 46px;
          --rule-h: 3px;
          --rule-gap: 24px;
          --slogan: 20px;
          --slogan-gap: 19px;
          --intro: 16px;
          --head-top: 64px;
          --head-bottom: 56px;
          --side: 16px;
          --grid-gap: 20px;
          --card-pad: 18px;
          --card-mark-gap: 16px;
          --card-title: 20px;
          --card-line: 15px;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        background: var(--ink);
        color: var(--paper);
        font-family: var(--text);
        font-weight: 500;
        font-variant-ligatures: none;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
      }
      h1,
      h2,
      p,
      ul {
        margin: 0;
      }

      /* The page: content above, the globe clipped in the bottom right corner behind it. */
      .page {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
      }
      .globe {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 1000px;
        height: 760px;
        z-index: 0;
        pointer-events: none;
      }
      .wrap {
        position: relative;
        z-index: 1;
        max-width: 1120px;
        margin-left: auto;
        margin-right: auto;
        padding-left: var(--side);
        padding-right: var(--side);
      }

      /* Header: lockup, Amber rule, slogan, intro, all centred like the banner. */
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding-top: var(--head-top);
        padding-bottom: var(--head-bottom);
      }
      .lockup {
        position: relative;
        display: flex;
        align-items: center;
        gap: var(--mark-gap);
        height: var(--mark);
        font-family: var(--display);
        font-weight: 700;
      }
      .lockup svg {
        display: block;
        width: var(--mark);
        height: var(--mark);
        flex: none;
      }
      .wordmark {
        font-size: var(--wordmark);
        line-height: 1;
        letter-spacing: 0.12em;
        margin-right: -0.12em; /* drop the spacing after the last letter: edges line up */
        color: var(--paper);
        white-space: nowrap;
      }
      .byline {
        position: absolute;
        top: var(--byline-top);
        right: 0;
        font-size: var(--byline);
        line-height: 1;
        letter-spacing: 0.32em;
        margin-right: -0.32em;
        color: var(--amber);
        white-space: nowrap;
      }
      .hero-rule {
        display: block;
        width: var(--rule-w);
        height: var(--rule-h);
        margin-top: var(--rule-gap);
        background: var(--amber);
      }
      .slogan {
        margin-top: var(--slogan-gap);
        font-family: var(--display);
        font-weight: 700;
        font-size: var(--slogan);
        line-height: 1.2;
        letter-spacing: 0.02em;
        text-wrap: balance;
      }
      .intro {
        margin-top: 16px;
        max-width: 560px;
        font-size: var(--intro);
        line-height: 1.5;
        color: var(--soft);
        text-wrap: balance;
      }

      /* Cards. Each card spans four rows of a shared subgrid, so the rule, the titles and the
         lines start at the same height across a row, even when one title runs to two lines. */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        column-gap: var(--grid-gap);
        row-gap: var(--grid-gap);
        padding: 0;
        list-style: none;
      }
      .cell {
        display: grid;
        grid-row: span 4;
        grid-template-rows: subgrid;
        row-gap: 0;
      }
      .card {
        display: grid;
        grid-row: span 4;
        grid-template-rows: subgrid;
        row-gap: 0;
        border-radius: 12px;
        overflow: hidden;
        background: var(--surface);
        color: var(--paper);
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
        transition: background-color var(--leave) var(--ease-out);
      }
      .thumb {
        display: block;
        overflow: hidden;
        aspect-ratio: 16 / 10;
        background: var(--surface);
      }
      .thumb img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1);
        transform-origin: 50% 50%;
        transition: transform var(--leave) var(--ease-out);
      }
      .mark {
        display: block;
        width: 32px;
        height: 3px;
        margin: var(--card-mark-gap) var(--card-pad) 0;
        background: var(--amber);
        transform-origin: 0 50%;
        transition: transform var(--leave) var(--ease-out);
      }
      .title {
        margin: 12px var(--card-pad) 0;
        font-family: var(--display);
        font-weight: 700;
        font-size: var(--card-title);
        line-height: 1.25;
        transition: color var(--leave) var(--ease-out);
      }
      .line {
        margin: 8px var(--card-pad) 0;
        padding-bottom: var(--card-pad);
        font-size: var(--card-line);
        line-height: 1.5;
        color: var(--soft);
      }

      /* Hover and keyboard focus: one calm motion, staged. The surface lightens first, the Amber
         rule draws out, the title turns Amber, and the picture eases in slowest of all. Leaving is
         quicker and all at once, so the card settles without lag. Only transform and colour move. */
      .card:focus {
        outline: none;
      }
      .card:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 4px;
      }
      @media (hover: hover) {
        .card:hover {
          background: var(--surface-hover);
          transition: background-color var(--enter) var(--ease-out);
        }
        .card:hover .thumb img {
          transform: scale(1.035);
          transition: transform var(--enter-slow) var(--ease-out);
        }
        .card:hover .mark {
          transform: scaleX(1.75);
          transition: transform var(--enter) var(--ease-out) var(--stagger);
        }
        .card:hover .title {
          color: var(--amber);
          transition: color var(--enter) var(--ease-out) calc(var(--stagger) * 2);
        }
      }
      .card:focus-visible {
        background: var(--surface-hover);
        transition: background-color var(--enter) var(--ease-out);
      }
      .card:focus-visible .thumb img {
        transform: scale(1.035);
        transition: transform var(--enter-slow) var(--ease-out);
      }
      .card:focus-visible .mark {
        transform: scaleX(1.75);
        transition: transform var(--enter) var(--ease-out) var(--stagger);
      }
      .card:focus-visible .title {
        color: var(--amber);
        transition: color var(--enter) var(--ease-out) calc(var(--stagger) * 2);
      }
      /* Touch: the press answers at once, with colour only (no sticky hover after the tap). */
      .card:active {
        background: var(--surface-hover);
        transition-duration: 0ms;
      }
      .card:active .title {
        color: var(--amber);
        transition: none;
      }

      .empty {
        font-size: 16px;
        line-height: 1.5;
        color: var(--soft);
      }

      /* Footer: licence on the left, the three links on the right. */
      .foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px 32px;
        padding-top: 72px;
        padding-bottom: 48px;
        font-size: 14px;
        line-height: 1.5;
        color: var(--soft);
      }
      .links {
        display: flex;
        gap: 20px;
        padding: 0;
        list-style: none;
      }
      .links a {
        display: block;
        color: rgb(244 241 234 / 0.85);
        transition: color var(--leave) var(--ease-out);
      }
      .links a:hover,
      .links a:focus-visible {
        color: var(--amber);
        transition: color var(--enter) var(--ease-out);
      }
      .links a:focus {
        outline: none;
      }
      .links a:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 4px;
      }
      .links svg {
        display: block;
        width: 24px;
        height: 24px;
        fill: currentColor;
      }
      @media (max-width: 639px) {
        .foot {
          padding-top: 56px;
          padding-bottom: 40px;
        }
        .globe {
          width: 520px;
          height: 395px;
        }
      }

      /* Reduced motion: no scaling or drawing out, only the colours change. */
      @media (prefers-reduced-motion: reduce) {
        .card:hover .thumb img,
        .card:focus-visible .thumb img,
        .card:hover .mark,
        .card:focus-visible .mark {
          transform: none;
        }
      }
    </style>
