[project]
name = "roman-roads-atlas"
version = "0.1.0"
description = "Atlas Lab: every Roman road, as an old atlas plate"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "mapbox-vector-tile>=2.2.0",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pmtiles>=3.8.1",
    "pyproj>=3.8.0",
    "requests>=2.34.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
