[project]
name = "florence-rain-1966"
version = "0.1.0"
description = "Atlas Lab: all the rain that drowned Florence, the Arno basin in 1966"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pyogrio>=0.13.0",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
