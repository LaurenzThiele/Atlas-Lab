[project]
name = "switzerland-in-one-line"
version = "0.1.0"
description = "AtlasLab: Switzerland in one line, Basel to the Italian border (ONE LINE 01)"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "numpy>=2.3",
    "pandas>=2.2",
    "pillow>=13.0.0",
    "pyproj>=3.7",
    "rasterio>=1.4",
    "requests>=2.32",
    "scipy>=1.18.1",
    "shapely>=2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
